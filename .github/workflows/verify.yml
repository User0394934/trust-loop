name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies on purpose. Node's standard library is enough, and a
      # repo arguing for verifiable automation should not need a lockfile to
      # check its own central claim.
      - name: Verify workflows, anonymity and the recorder fingerprint
        run: node tests/verify.mjs
